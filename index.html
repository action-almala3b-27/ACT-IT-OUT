<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>التمثيل | ACT IT OUT</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #09090B;
    font-family: 'Montserrat', 'Cairo', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .arabic { font-family: 'Cairo', sans-serif; }
  .screen { height: 100dvh; width: 100%; }

  .home-bg {
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(236,72,153,0.16), transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 100%, rgba(139,92,246,0.16), transparent 60%),
      #09090B;
  }
  .hero-icon { filter: drop-shadow(0 0 10px #EC4899) drop-shadow(0 0 22px #8B5CF6); }
  .title-gradient {
    background: linear-gradient(90deg, #FB7185 0%, #EC4899 35%, #C084FC 70%, #8B5CF6 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 14px rgba(236,72,153,0.45)) drop-shadow(0 0 28px rgba(139,92,246,0.35));
    letter-spacing: 0.04em;
  }
  .subtitle-glow { color: #B794F4; text-shadow: 0 0 10px rgba(167,139,250,0.6); }
  .glow-text { color: #C4B5FD; text-shadow: 0 0 8px #8B5CF6, 0 0 24px #8B5CF6, 0 0 48px #6D28D9; }

  .glass {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(139,92,246,0.25);
    box-shadow: 0 0 24px rgba(139,92,246,0.08), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .home-card {
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  .btn-hero {
    background: linear-gradient(90deg, #F43F5E, #EC4899 55%, #8B5CF6);
    box-shadow: 0 0 22px rgba(236,72,153,0.45), 0 0 40px rgba(139,92,246,0.25);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn-hero:active { transform: scale(0.97); }
  .btn-hero:disabled { opacity: 0.35; box-shadow: none; }
  .btn-join { background: linear-gradient(90deg, #7C3AED, #8B5CF6); box-shadow: 0 0 16px rgba(139,92,246,0.5); }
  .btn-ghost {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    transition: transform .12s ease, background .12s ease;
  }
  .btn-ghost:active { transform: scale(0.96); }
  .btn-correct { background: linear-gradient(135deg, #22C55E, #15803D); box-shadow: 0 0 20px rgba(34,197,94,0.45); }
  .btn-correct:active { transform: scale(0.96); }

  .input-glass {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .input-glass:focus, .input-glass:focus-within {
    outline: none; border-color: rgba(196,132,252,0.6);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.15), 0 0 16px rgba(139,92,246,0.25);
  }
  .input-glass::placeholder { color: #52525B; }

  .cat-card {
    background: rgba(255,255,255,0.035);
    border: 1.5px solid rgba(255,255,255,0.10);
    transition: all .15s ease;
    position: relative;
  }
  .cat-card.selected {
    border-color: #C084FC;
    box-shadow: 0 0 0 2px rgba(139,92,246,0.25), 0 0 18px rgba(139,92,246,0.4);
    background: rgba(139,92,246,0.10);
  }
  .cat-card:active { transform: scale(0.97); }
  .cat-check {
    width: 22px; height: 22px; border-radius: 7px;
    border: 1.5px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all .15s ease;
    font-size: 13px; font-weight: 900;
  }
  .cat-card.selected .cat-check {
    background: linear-gradient(135deg, #EC4899, #8B5CF6);
    border-color: transparent;
    box-shadow: 0 0 10px rgba(236,72,153,0.5);
  }

  .opt-pill {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    transition: all .15s ease;
  }
  .opt-pill.selected {
    border-color: #EC4899;
    background: linear-gradient(90deg, rgba(244,63,94,0.25), rgba(139,92,246,0.25));
    box-shadow: 0 0 12px rgba(236,72,153,0.35);
  }

  .timer-ring {
    transition: stroke-dashoffset 1s linear, stroke .3s ease;
  }

  .word-reveal {
    animation: popin .25s ease;
  }
  @keyframes popin { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .shake { animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  #teamStrip::-webkit-scrollbar { display: none; }
  #teamStrip { scrollbar-width: none; }
  #categoryGrid::-webkit-scrollbar { display: none; }
  #categoryGrid { scrollbar-width: none; }

  .toast { animation: fadein .2s ease, fadeout .3s ease 2.4s forwards; }
  @keyframes fadein { from { opacity:0; transform: translate(-50%, 10px);} to { opacity:1; transform: translate(-50%,0);} }
  @keyframes fadeout { to { opacity: 0; } }
</style>
</head>
<body class="text-white">

<!-- Toast -->
<div id="toastHost" class="fixed top-3 left-1/2 z-50 pointer-events-none"></div>

<!-- ============ SCREEN 1: LANGUAGE SELECT ============ -->
<div id="screen-lang" class="screen home-bg flex flex-col items-center justify-center px-6">
  <div class="mb-8 text-center">
    <div class="hero-icon text-6xl mb-2">🎭</div>
    <h1 class="text-4xl font-black title-gradient tracking-widest leading-tight">التمثيل</h1>
    <p class="text-2xl font-black subtitle-glow mt-1 tracking-widest">ACT IT OUT</p>
    <p class="text-zinc-500 text-xs mt-3 tracking-wide">لعبة تمثيل جماعية من موبايل واحد فقط</p>
  </div>

  <div class="home-card rounded-2xl p-5 w-full max-w-sm space-y-3">
    <button data-lang="ar" class="lang-btn btn-hero w-full rounded-xl py-4 text-lg font-black arabic">العربية</button>
    <button data-lang="en" class="lang-btn btn-join w-full rounded-xl py-4 text-lg font-black tracking-wide">English</button>
  </div>

  <p class="text-zinc-600 text-[11px] mt-6 text-center max-w-xs leading-relaxed">
    مرر الموبايل بين الفرق • Pass the phone between teams
  </p>
</div>

<!-- ============ SCREEN 2: SETUP (category / timer / teams) ============ -->
<div id="screen-setup" class="screen hidden home-bg flex-col overflow-hidden">
  <div class="flex items-center justify-between px-4 py-3 shrink-0">
    <button id="backToLang" class="btn-ghost rounded-full w-9 h-9 flex items-center justify-center text-lg">←</button>
    <div class="text-center">
      <div id="setupTitle" class="text-lg font-black glow-text tracking-widest arabic">التمثيل</div>
    </div>
    <button id="howToPlayBtn" class="btn-ghost rounded-full w-9 h-9 flex items-center justify-center text-lg">❓</button>
  </div>

  <div class="flex-1 overflow-y-auto px-4 pb-3 space-y-4">
    <!-- Category (multi-select) -->
    <div>
      <div class="flex items-center justify-between mb-2">
        <div id="labelCategory" class="text-[11px] tracking-widest text-zinc-400 arabic">اختار فئة أو أكتر</div>
        <div id="categoryHint" class="text-[10px] text-purple-300 arabic"></div>
      </div>
      <div id="categoryGrid" class="grid grid-cols-1 gap-2"></div>
    </div>

    <!-- Timer -->
    <div>
      <div id="labelTimer" class="text-[11px] tracking-widest text-zinc-400 mb-2 arabic">مدة الوقت</div>
      <div class="grid grid-cols-3 gap-2">
        <button data-timer="30" class="timer-btn opt-pill rounded-xl py-2.5 font-black">30s</button>
        <button data-timer="60" class="timer-btn opt-pill rounded-xl py-2.5 font-black selected">60s</button>
        <button data-timer="90" class="timer-btn opt-pill rounded-xl py-2.5 font-black">90s</button>
      </div>
    </div>

    <!-- Teams -->
    <div>
      <div id="labelTeams" class="text-[11px] tracking-widest text-zinc-400 mb-2 arabic">عدد الفرق</div>
      <div class="input-glass flex items-center justify-between rounded-xl px-4 py-2.5">
        <button id="teamMinus" class="btn-ghost rounded-lg w-9 h-9 text-xl font-black flex items-center justify-center">−</button>
        <div id="teamCountDisplay" class="text-2xl font-black">2</div>
        <button id="teamPlus" class="btn-ghost rounded-lg w-9 h-9 text-xl font-black flex items-center justify-center">+</button>
      </div>
    </div>

    <!-- Team names -->
    <div>
      <div id="labelNames" class="text-[11px] tracking-widest text-zinc-400 mb-2 arabic">أسماء الفرق (اختياري)</div>
      <div id="teamNamesList" class="space-y-2"></div>
    </div>
  </div>

  <div class="shrink-0 px-4 pb-4 pt-1">
    <button id="startGameBtn" class="btn-hero w-full rounded-xl py-3.5 text-lg font-black arabic">ابدأ اللعب 🎬</button>
  </div>
</div>

<!-- ============ HOW TO PLAY MODAL ============ -->
<div id="howToModal" class="hidden fixed inset-0 z-40 bg-black/85 backdrop-blur-sm flex items-center justify-center px-6">
  <div class="home-card rounded-2xl p-6 w-full max-w-sm text-center max-h-[80vh] overflow-y-auto">
    <div class="text-4xl mb-3">📖</div>
    <h2 id="howToTitle" class="text-xl font-black title-gradient mb-4 arabic">قواعد اللعبة</h2>
    <div id="howToBody" class="text-sm text-zinc-300 leading-relaxed text-right space-y-2 arabic"></div>
    <button id="closeHowToBtn" class="btn-hero w-full rounded-xl py-3 font-black mt-5 arabic">تمام، فهمت</button>
  </div>
</div>

<!-- ============ SCREEN 3: GAME ============ -->
<div id="screen-game" class="screen hidden flex-col home-bg">
  <!-- Top bar -->
  <div class="flex items-center justify-between px-4 py-2 shrink-0">
    <button id="endGameBtn" class="btn-ghost rounded-full px-3 py-1.5 text-[11px] font-bold">🏁 <span class="endTxt">إنهاء</span></button>
    <div class="text-sm font-black glow-text tracking-widest">🎭 <span class="arabic">التمثيل</span></div>
    <div class="text-[11px] text-zinc-500 flex items-center gap-2">
      <span id="catNameTag"></span>
      <span class="opt-pill rounded-full px-2 py-0.5">🎯 <span id="targetScoreTag">5</span></span>
    </div>
  </div>

  <!-- Team scores strip -->
  <div id="teamStrip" class="flex gap-1.5 overflow-x-auto px-3 pb-2 shrink-0"></div>

  <!-- Center game field -->
  <div class="flex-1 flex flex-col items-center justify-center px-6 min-h-0 relative">

    <!-- Pre-round: whose turn -->
    <div id="turnIntro" class="text-center">
      <div class="text-zinc-400 text-sm mb-1 arabic">دور فريق</div>
      <div id="currentTeamName" class="text-3xl font-black title-gradient mb-6"></div>
      <button id="revealBtn" class="btn-hero rounded-2xl px-8 py-5 text-lg font-black arabic">👆 اضغط لإظهار الكلمة</button>
    </div>

    <!-- Active round: timer + word + single correct button -->
    <div id="roundActive" class="hidden flex-col items-center w-full">
      <div class="flex items-center justify-center gap-5 w-full max-w-xs mb-6">
        <div class="relative w-24 h-24 shrink-0">
          <svg viewBox="0 0 100 100" class="w-24 h-24 -rotate-90">
            <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
            <circle id="timerRing" cx="50" cy="50" r="44" fill="none" stroke="#8B5CF6" stroke-width="8"
              stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0" class="timer-ring"/>
          </svg>
          <div id="timerNum" class="absolute inset-0 flex items-center justify-center text-2xl font-black">60</div>
        </div>
        <button id="correctBtn" class="btn-correct rounded-2xl py-6 flex-1 h-24 font-black text-white text-lg">✅ <span class="arabic">صح</span> +1</button>
      </div>

      <div id="wordCard" class="word-reveal home-card rounded-2xl px-6 py-8 w-full max-w-xs text-center">
        <div id="wordTag" class="text-[10px] tracking-widest text-purple-300 mb-1"></div>
        <div id="wordText" class="text-2xl font-black leading-snug"></div>
      </div>
    </div>

    <!-- Round end summary -->
    <div id="roundEnd" class="hidden flex-col items-center text-center">
      <div id="endIcon" class="text-5xl mb-3">⏰</div>
      <div id="endHeadline" class="text-xl font-black mb-1 arabic">خلص الوقت!</div>
      <div class="text-zinc-400 text-sm mb-1 arabic">فريق <span id="endTeamName" class="text-purple-300 font-bold"></span></div>
      <div class="text-4xl font-black glow-text mb-6"><span id="endRoundScore">+0</span></div>
      <button id="nextTeamBtn" class="btn-hero rounded-xl px-8 py-3.5 font-black arabic">التالي ⏩</button>
    </div>
  </div>
</div>

<!-- ============ FINAL SCOREBOARD MODAL ============ -->
<div id="finalModal" class="hidden fixed inset-0 z-40 bg-black/85 backdrop-blur-sm flex items-center justify-center px-6">
  <div class="home-card rounded-2xl p-6 w-full max-w-sm text-center">
    <div class="text-5xl mb-3">🏆</div>
    <h2 class="text-2xl font-black title-gradient mb-4 arabic">النتيجة النهائية</h2>
    <div id="finalScoreList" class="space-y-2 mb-6 text-left"></div>
    <button id="playAgainBtn" class="btn-hero w-full rounded-xl py-3 font-black arabic">لعبة جديدة</button>
  </div>
</div>

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, duration, type = 'sine', gainVal = 0.18) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = gainVal;
  osc.connect(gain).connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(gainVal, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  osc.start(now);
  osc.stop(now + duration);
}
function tickSound() { beep(880, 0.08, 'square', 0.12); }
function buzzSound() {
  beep(160, 0.5, 'sawtooth', 0.22);
  setTimeout(() => beep(120, 0.6, 'sawtooth', 0.22), 150);
}
function correctSound() { beep(1046, 0.12, 'sine', 0.16); setTimeout(() => beep(1318, 0.14, 'sine', 0.16), 90); }

}

/* =========================================================
   SCREEN 2 — SETUP
   ========================================================= */
function t(ar, en) { return state.lang === 'ar' ? ar : en; }

function packWordCount(key) {
  return PACKS[key].words[state.lang].length;
}

function updateCategoryHint() {
  const n = state.selectedPacks.length;
  $('categoryHint').textContent = n > 0
    ? `${n} ${t('فئة مختارة', n === 1 ? 'pack selected' : 'packs selected')}`
    : t('اختار فئة واحدة على الأقل', 'Select at least one pack');
}

function buildSetupScreen() {
  $('setupTitle').textContent = t('التمثيل', 'ACT IT OUT');
  $('labelCategory').textContent = t('اختار فئة أو أكتر', 'CHOOSE ONE OR MORE PACKS');
  $('labelTimer').textContent = t('مدة الوقت', 'TIMER DURATION');
  $('labelTeams').textContent = t('عدد الفرق', 'NUMBER OF TEAMS');
  $('labelNames').textContent = t('أسماء الفرق (اختياري)', 'TEAM NAMES (OPTIONAL)');
  $('startGameBtn').innerHTML = t('ابدأ اللعب 🎬', '🎬 START GAME');
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';

  // Category grid — multi-select toggle cards
  const grid = $('categoryGrid');
  grid.innerHTML = '';
  if (state.selectedPacks.length === 0) state.selectedPacks = [PACK_ORDER[0]];

  PACK_ORDER.forEach((key) => {
    const pack = PACKS[key];
    const isSelected = state.selectedPacks.includes(key);
    const card = document.createElement('button');
    card.className = `cat-card rounded-xl px-4 py-3 flex items-center gap-3 text-left w-full ${isSelected ? 'selected' : ''}`;
    card.dataset.key = key;
    const wordCount = pack.words[state.lang].length;
    card.innerHTML = `
      <div class="text-2xl">${pack.icon}</div>
      <div class="flex-1">
        <div class="font-bold text-sm ${state.lang === 'ar' ? 'arabic' : ''}">${pack.name[state.lang]}</div>
        <div class="text-[10px] text-zinc-500">+${wordCount} ${t('كلمة', 'words')}</div>
      </div>
      <div class="cat-check">${isSelected ? '✓' : ''}</div>
    `;
    card.addEventListener('click', () => {
      const idx = state.selectedPacks.indexOf(key);
      if (idx >= 0) {
        // prevent deselecting the last remaining pack
        if (state.selectedPacks.length === 1) {
          toast(t('لازم فئة واحدة على الأقل', 'At least one pack is required'));
          return;
        }
        state.selectedPacks.splice(idx, 1);
        card.classList.remove('selected');
        card.querySelector('.cat-check').textContent = '';
      } else {
        state.selectedPacks.push(key);
        card.classList.add('selected');
        card.querySelector('.cat-check').textContent = '✓';
      }
      updateCategoryHint();
    });
    grid.appendChild(card);
  });

  updateCategoryHint();
  renderTeamNameInputs();
}

// Timer pills
document.querySelectorAll('.timer-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.timer-btn').forEach((b) => b.classList.remove('selected'));
    btn.classList.add('selected');
    state.timerDuration = parseInt(btn.dataset.timer, 10);
  });
});

// Team count stepper
$('teamMinus').addEventListener('click', () => {
  state.teamCount = Math.max(2, state.teamCount - 1);
  $('teamCountDisplay').textContent = state.teamCount;
  renderTeamNameInputs();
});
$('teamPlus').addEventListener('click', () => {
  state.teamCount = Math.min(8, state.teamCount + 1);
  $('teamCountDisplay').textContent = state.teamCount;
  renderTeamNameInputs();
});

function renderTeamNameInputs() {
  const list = $('teamNamesList');
  list.innerHTML = '';
  for (let i = 0; i < state.teamCount; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'input-glass rounded-xl px-3 py-1';
    wrap.innerHTML = `
      <input type="text" maxlength="14" data-idx="${i}"
        placeholder="${t('فريق', 'Team')} ${i + 1}"
        class="team-name-input w-full bg-transparent outline-none text-sm py-2 text-white placeholder-zinc-600" />
    `;
    list.appendChild(wrap);
  }
}

$('startGameBtn').addEventListener('click', () => {
  ensureAudio();
  if (state.selectedPacks.length === 0) {
    toast(t('اختار فئة واحدة على الأقل', 'Select at least one pack'));
    return;
  }

  const nameInputs = document.querySelectorAll('.team-name-input');
  state.teams = [];
  nameInputs.forEach((inp, i) => {
    const val = inp.value.trim();
    state.teams.push({ name: val || `${t('فريق', 'Team')} ${i + 1}`, score: 0 });
  });

  state.wordQueue = buildMergedWordPool();
  state.lastWord = null;
  state.currentTeamIndex = 0;
  state.targetScore = 5;
  state.deuceTriggered = false;
  state.gameOver = false;
  state.winner = null;

  buildGameScreen();
  showScreen('screen-game');
  startTurn();
});

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Builds a shuffled queue of {word, packKey} pulled purely randomly across
// every currently-selected pack, so words from different packs interleave
// unpredictably rather than draining one pack before the next.
function buildMergedWordPool() {
  const pool = [];
  state.selectedPacks.forEach((key) => {
    const pack = PACKS[key];
    pack.words[state.lang].forEach((word) => {
      pool.push({ word, packKey: key, icon: pack.icon });
    });
  });
  return shuffle(pool);
}

function nextWord() {
  if (state.wordQueue.length === 0) {
    state.wordQueue = buildMergedWordPool();
  }
  return state.wordQueue.pop();
}

/* =========================================================
   SCREEN 3 — GAME
   ========================================================= */
function buildGameScreen() {
  // Label on top
  const packLabels = state.selectedPacks.map((k) => PACKS[k].icon).join(' ');
  $('catNameTag').textContent = packLabels;
  $('targetScoreTag').textContent = state.targetScore;
  renderTeamStrip();
}

function renderTeamStrip() {
  const strip = $('teamStrip');
  strip.innerHTML = '';
  state.teams.forEach((t, i) => {
    const isCurrent = i === state.currentTeamIndex;
    const item = document.createElement('div');
    item.className = `opt-pill rounded-xl px-3 py-1.5 shrink-0 flex items-center gap-2 ${isCurrent ? 'selected font-bold' : 'opacity-70'}`;
    item.innerHTML = `
      <span class="text-xs ${state.lang === 'ar' ? 'arabic' : ''}">${t.name}</span>
      <span class="text-xs font-black text-purple-300 bg-white/10 px-1.5 py-0.5 rounded-md">${t.score}</span>
    `;
    strip.appendChild(item);
  });
}

function startTurn() {
  clearInterval(state.timerId);
  state.roundActive = false;
  renderTeamStrip();

  $('turnIntro').classList.remove('hidden');
  $('roundActive').classList.add('hidden');$('roundEnd').classList.add('hidden');

  const cur = state.teams[state.currentTeamIndex];
  $('currentTeamName').textContent = cur.name;
}

$('revealBtn').addEventListener('click', () => {
  ensureAudio();
  $('turnIntro').classList.add('hidden');
  $('roundActive').classList.remove('hidden');$('roundActive').classList.add('flex');

  state.lastWord = nextWord();
  $('wordText').textContent = state.lastWord.word;
  const pack = PACKS[state.lastWord.packKey];
  $('wordTag').textContent = `${pack.icon} ${pack.name[state.lang]}`;

  state.timeLeft = state.timerDuration;
  state.roundActive = true;
  updateTimerUI();

  state.timerId = setInterval(() => {
    state.timeLeft--;
    updateTimerUI();

    if (state.timeLeft <= 5 && state.timeLeft > 0) {
      tickSound();
    }

    if (state.timeLeft <= 0) {
      clearInterval(state.timerId);
      buzzSound();
      endRound('timeout');
    }
  }, 1000);
});

function updateTimerUI() {
  $('timerNum').textContent = state.timeLeft;
  const fraction = state.timeLeft / state.timerDuration;
  const offset = RING_CIRC * (1 - fraction);
  const ring = $('timerRing');
  ring.style.strokeDashoffset = offset;
  ring.setAttribute('stroke', state.timeLeft <= 10 ? '#EF4444' : '#8B5CF6');
}

// Single Correct button -> adds +1 point and immediately ends the round
$('correctBtn').addEventListener('click', () => {
  if (!state.roundActive) return;
  clearInterval(state.timerId);
  correctSound();

  const cur = state.teams[state.currentTeamIndex];
  cur.score += 1;
  endRound('correct');
});

function checkDeuceAndWinner() {
  // Check Deuce rule: if ALL teams reach targetScore - 1 (e.g. 4-4 when target is 5)
  // bump targetScore to 6
  if (!state.deuceTriggered) {
    const allAtDeuce = state.teams.length >= 2 && state.teams.every((t) => t.score === state.targetScore - 1);
    if (allAtDeuce) {
      state.targetScore += 1;
      state.deuceTriggered = true;
      $('targetScoreTag').textContent = state.targetScore;
      toast(t('🔥 تعادل! الهدف أصبح 6 نقاط', '🔥 Deuce! Target is now 6 points'));
    }
  }

  // Check winner: any team >= targetScore
  const winner = state.teams.find((t) => t.score >= state.targetScore);
  if (winner) {
    state.gameOver = true;
    state.winner = winner;
  }
}

function endRound(outcome) {
  state.roundActive = false;
  state.lastOutcome = outcome;
  checkDeuceAndWinner();

  $('roundActive').classList.add('hidden');$('roundActive').classList.remove('flex');
  $('roundEnd').classList.remove('hidden');$('roundEnd').classList.add('flex');

  const cur = state.teams[state.currentTeamIndex];
  $('endTeamName').textContent = cur.name;

  if (outcome === 'correct') {
    $('endIcon').textContent = '🎉';
    $('endHeadline').textContent = t('إجابة صحيحة!', 'Correct Answer!');
    $('endRoundScore').textContent = '+1';$('endRoundScore').className = 'text-4xl font-black text-green-400 mb-6';
  } else {
    $('endIcon').textContent = '⏰';$('endHeadline').textContent = t('خلص الوقت!', "Time's Up!");
    $('endRoundScore').textContent = '+0';$('endRoundScore').className = 'text-4xl font-black text-zinc-500 mb-6';
  }

  if (state.gameOver) {
    $('nextTeamBtn').textContent = t('عرض النتيجة 🏆', 'View Final Results 🏆');
  } else {
    $('nextTeamBtn').textContent = t('التالي ⏩', 'Next Turn ⏩');
  }
}

$('nextTeamBtn').addEventListener('click', () => {
  if (state.gameOver) {
    showFinalBoard();
    return;
  }
  state.currentTeamIndex = (state.currentTeamIndex + 1) % state.teams.length;
  startTurn();
});

$('endGameBtn').addEventListener('click', () => {
  clearInterval(state.timerId);
  showFinalBoard();
});

/* =========================================================
   FINAL SCOREBOARD
   ========================================================= */
function showFinalBoard() {
  const sorted = [...state.teams].sort((a, b) => b.score - a.score);
  const list = $('finalScoreList');
  list.innerHTML = '';

  sorted.forEach((t, i) => {
    const isWinner = i === 0 && t.score > 0;
    const item = document.createElement('div');
    item.className = `input-glass rounded-xl px-4 py-3 flex items-center justify-between ${isWinner ? 'border-purple-400 bg-purple-500/10' : ''}`;
    item.innerHTML = `
      <div class="flex items-center gap-3">
        <span class="text-xl">${i === 0 ? '👑' : i === 1 ? '🥈' : i === 2 ? '🥉' : '👏'}</span>
        <span class="font-bold text-base ${state.lang === 'ar' ? 'arabic' : ''}">${t.name}</span>
      </div>
      <span class="text-xl font-black text-purple-300">${t.score}</span>
    `;
    list.appendChild(item);
  });

  $('playAgainBtn').textContent = t('لعبة جديدة 🔄', 'Play Again 🔄');
  $('finalModal').classList.remove('hidden');$('finalModal').classList.add('flex');
}

$('playAgainBtn').addEventListener('click', () => {
  $('finalModal').classList.add('hidden');$('finalModal').classList.remove('flex');
  showScreen('screen-setup');
});
</script>
