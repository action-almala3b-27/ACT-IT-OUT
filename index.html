<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action Almala3b</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#00e5ff;
    --cyan-dim:#00e5ff66;
    --white:#ffffff;
    --bg:#000000;
    --muted:rgba(255,255,255,0.45);
    --muted-dim:rgba(255,255,255,0.25);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;min-height:100%;background:var(--bg);
    font-family:'Tajawal',sans-serif;color:var(--white);
    overflow-x:hidden;
  }

  /* ===== BACKGROUND ===== */
  .bg-field{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 18%, rgba(0,229,255,0.10), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(0,229,255,0.05), transparent 70%),
      var(--bg);
  }
  .bg-lines{
    position:fixed;inset:0;z-index:0;opacity:0.35;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:48px 48px;
  }

  /* ===== HERO ===== */
  .hero{
    position:relative;z-index:2;
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 24px 56px;
    text-align:center;
    gap:38px;
  }

  .brand{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    line-height:1;
  }
  .brand-row{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(38px, 11vw, 78px);
    letter-spacing:2px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.08em;
  }
  .word-action{
    color:var(--cyan);
    animation:glowPulse 3.2s ease-in-out infinite;
  }
  .word-almalaeb{
    color:var(--white);
    animation:glowPulseWhite 3.2s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{ text-shadow:0 0 18px var(--cyan-dim), 0 0 2px rgba(0,229,255,0.4); opacity:0.88; }
    50%{ text-shadow:0 0 40px var(--cyan), 0 0 70px rgba(0,229,255,0.55); opacity:1; }
  }
  @keyframes glowPulseWhite{
    0%,100%{ text-shadow:0 0 14px rgba(255,255,255,0.25); opacity:0.85; }
    50%{ text-shadow:0 0 34px rgba(255,255,255,0.6), 0 0 60px rgba(255,255,255,0.25); opacity:1; }
  }
  .tagline{
    font-family:'Orbitron',sans-serif;
    font-size:clamp(10px,2.4vw,13px);
    letter-spacing:5px;
    color:var(--muted);
    margin-top:6px;
  }

  /* ===== PLAY BUTTON ===== */
  .play-btn{
    position:relative;
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(17px,4vw,22px);
    letter-spacing:3px;
    color:#02131c;
    background:linear-gradient(135deg,#00e5ff,#00b8d4);
    border:none;
    border-radius:60px;
    padding:20px 58px;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;align-items:center;gap:12px;
    box-shadow:0 0 30px rgba(0,229,255,0.45), 0 8px 24px rgba(0,0,0,0.5);
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .play-btn:hover, .play-btn:active{
    transform:scale(1.05);
    box-shadow:0 0 48px rgba(0,229,255,0.7), 0 10px 30px rgba(0,0,0,0.55);
  }
  .play-btn svg{width:18px;height:18px;flex-shrink:0;}

  /* ===== RULES LINK ===== */
  .rules-teaser{
    display:flex;flex-direction:column;align-items:center;gap:12px;
  }
  .rules-teaser-text{
    display:flex;flex-direction:row-reverse;align-items:baseline;gap:10px;
    flex-wrap:wrap;justify-content:center;
  }
  .rules-teaser-en{
    font-size:13px;color:var(--muted);letter-spacing:0.3px;
  }
  .rules-teaser-ar{
    font-size:14px;color:var(--muted);font-weight:700;
  }
  .rules-teaser-sep{
    color:var(--muted-dim);font-size:12px;
  }
  .rules-arrow{
    color:#ffd700;
    animation:bounceDown 1.8s ease-in-out infinite;
  }
  @keyframes bounceDown{
    0%,100%{ transform:translateY(0); opacity:0.5; }
    50%{ transform:translateY(6px); opacity:1; }
  }

  .rules-btn{
    font-family:'Orbitron',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:2px;
    color:var(--white);
    background:transparent;
    border:1.5px solid rgba(255,255,255,0.3);
    border-radius:50px;
    padding:12px 30px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .rules-btn:hover, .rules-btn:active{
    background:rgba(255,255,255,0.08);
    border-color:rgba(255,255,255,0.55);
  }

  footer{
    position:relative;z-index:2;
    text-align:center;
    padding:0 20px 28px;
    font-size:11px;
    color:var(--muted-dim);
    letter-spacing:1px;
  }

  /* ===== RULES MODAL ===== */
  .modal-overlay{
    display:none;position:fixed;inset:0;z-index:100;
    background:rgba(0,0,0,0.82);
    align-items:flex-start;justify-content:center;
    padding:0;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:#050708;
    border:1px solid rgba(0,229,255,0.22);
    width:100%;max-width:560px;
    height:100svh;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  @media(min-width:640px){
    .modal-overlay{padding:32px;align-items:center;}
    .modal-box{height:auto;max-height:88vh;border-radius:18px;}
  }

  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    flex-shrink:0;
  }
  .lang-toggle{
    display:flex;gap:6px;background:rgba(255,255,255,0.05);border-radius:30px;padding:3px;
  }
  .lang-btn{
    font-family:'Orbitron',sans-serif;
    font-size:11px;font-weight:700;letter-spacing:1px;
    padding:7px 16px;border-radius:30px;border:none;
    background:transparent;color:var(--muted);cursor:pointer;
    transition:all 0.15s ease;
  }
  .lang-btn.active{
    background:var(--cyan);color:#02131c;
  }
  .modal-close{
    background:none;border:none;color:var(--muted);
    font-size:26px;line-height:1;cursor:pointer;padding:4px 8px;
  }
  .modal-close:hover{color:var(--white);}

  .modal-title-row{
    padding:16px 22px 4px;flex-shrink:0;
  }
  .modal-title{
    font-family:'Orbitron',sans-serif;
    font-size:20px;font-weight:900;color:var(--cyan);
    letter-spacing:1px;
  }

  .modal-body{
    flex:1;overflow-y:auto;
    padding:14px 22px 30px;
  }
  .modal-body::-webkit-scrollbar{width:5px;}
  .modal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px;}

  .rule-section{margin-top:22px;}
  .rule-section:first-child{margin-top:6px;}
  .rule-section-title{
    font-family:'Orbitron',sans-serif;
    font-size:12px;letter-spacing:2px;
    color:rgba(255,255,255,0.4);
    margin-bottom:10px;
  }
  .rule-item{
    display:flex;gap:12px;align-items:flex-start;
    padding:11px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .rule-item:last-child{border-bottom:none;}
  .rule-badge{
    flex-shrink:0;width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
  }
  .rule-text{flex:1;}
  .rule-text-title{font-size:14px;font-weight:700;margin-bottom:2px;}
  .rule-text-desc{font-size:12.5px;color:var(--muted);line-height:1.55;}

  .badge-cyan{background:rgba(0,229,255,0.12);}
  .badge-gold{background:rgba(255,215,0,0.12);}
  .badge-red{background:rgba(255,59,59,0.12);}

.gullit-tag{
    display:inline-flex;align-items:center;gap:5px;
    background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.3);
    border-radius:20px;padding:2px 9px 2px 2px;margin-inline-start:6px;
    vertical-align:middle;
  }
  .gullit-tag img{
    width:20px;height:20px;border-radius:50%;object-fit:cover;object-position:center 15%;
    display:block;
  }
  .gullit-tag span{
    font-size:11px;font-weight:700;color:#ffd700;font-family:'Orbitron',sans-serif;
  }

  [dir="rtl"] .rule-item{direction:rtl;}
  [dir="rtl"] .modal-body{text-align:right;}
</style>
</head>
<body>

<div class="bg-field"></div>
<div class="bg-lines"></div>

<div class="hero">
  <div class="brand">
    <div class="brand-row">
      <span class="word-action">Action</span><span class="word-almalaeb">Almala3b</span>
    </div>
    <div class="tagline">ONLINE FOOTBALL CARD GAME</div>
  </div>

  <a class="play-btn" href="https://game-production-5fe9.up.railway.app/">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    PLAY NOW
  </a>

  <div class="rules-teaser">
    <div class="rules-teaser-text">
      <div class="rules-teaser-ar">لمعرفة قواعد اللعبة، اضغط هنا</div>
      <span class="rules-teaser-sep">/</span>
      <div class="rules-teaser-en">To learn the game rules, click here</div>
    </div>
    <div class="rules-arrow">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 4v14M6 13l6 6 6-6"/></svg>
    </div>
    <button class="rules-btn" onclick="openRules()">GAME RULES</button>
  </div>
</div>

<footer>ACTION ALMALA3B &mdash; BUILD YOUR SQUAD. BEAT THE FIELD.</footer>

<!-- RULES MODAL -->
<div class="modal-overlay" id="rulesModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="lang-toggle">
        <button class="lang-btn active" id="btnEn" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="btnAr" onclick="setLang('ar')">عربي</button>
      </div>
      <button class="modal-close" onclick="closeRules()">&times;</button>
    </div>
    <div class="modal-title-row">
      <div class="modal-title" id="modalTitle">GAME RULES</div>
    </div>
    <div class="modal-body" id="modalBody" dir="ltr"></div>
  </div>
</div>

<script>
function openRules(){ document.getElementById('rulesModal').classList.add('show'); }
function closeRules(){ document.getElementById('rulesModal').classList.remove('show'); }
document.getElementById('rulesModal').addEventListener('click', e=>{
  if(e.target.id==='rulesModal') closeRules();
});

const content = {
  en: {
    title: 'GAME RULES',
    sections: [
      {
        heading: 'HOW TO WIN',
        items: [
          { icon:'🏆', badge:'badge-cyan', title:'Complete a valid formation', desc:'Build your squad into one of three formations: 4-3-3, 4-4-2, or 5-3-2 — always with 1 goalkeeper.' },
          { icon:'⭐', badge:'badge-gold', title:'Have a captain on the field', desc:'At least one card on your field must be a captain card.' },
          { icon:'✨', badge:'badge-gold', title:'Star players in every line, or consecutive numbers', desc:'Win in one of two ways: either have a star player in your defense, midfield, and attack at the same time, or achieve consecutive numbers in one line — 2-3-4 or 3-4-5 in defense, 6-7-8 in midfield, or 9-10-11 in attack. The Gullit card can complete the missing number in the sequence.' }
        ]
      },
      {
        heading: 'ON YOUR TURN',
        items: [
          { icon:'🃏', badge:'badge-cyan', title:'Draw up to 2 cards', desc:'Draw from the deck up to twice per turn.' },
          { icon:'⚽', badge:'badge-cyan', title:'Place up to 2 cards', desc:'Place player cards or play special cards, up to 2 actions per turn, then end your turn.' },
          { icon:'📋', badge:'badge-cyan', title:'Respect zone limits', desc:'Max per zone: 1 goalkeeper, 5 defenders, 4 midfielders, 3 attackers — 11 players total.' }
        ]
      },
      {
        heading: 'SPECIAL CARDS',
        items: [
          { icon:'🔴', badge:'badge-red', title:'Red Card', desc:'Instantly removes a chosen player from an opponent\'s field.' },
          { icon:'🟡', badge:'badge-gold', title:'Yellow Card', desc:'Cautions a player. A second yellow on the same card removes it from the field.' },
          { icon:'🚫', badge:'badge-cyan', title:'Offside', desc:'Skips the target player\'s next turn.' },
          { icon:'🔄', badge:'badge-cyan', title:'Swap', desc:'Trade one of your field players for one of an opponent\'s.' },
          { icon:'📝', badge:'badge-gold', title:'Contract', desc:'Permanently takes a player from an opponent\'s field onto yours.' },
          { icon:'⏳', badge:'badge-cyan', title:'Loan', desc:'Borrows an opponent\'s player for 2 turns, then returns them automatically.' },
          { icon:'🛡️', badge:'badge-cyan', title:'Cancel Order', desc:'Cancels a special card played against you — use it within the reaction window.' },
          { icon:'🗑️', badge:'badge-red', title:'Trash Player', desc:'Removes one of your own field players — used to fix a bad placement.' },
          { icon:'👑', badge:'badge-gold', title:'Gullit', desc:'A wildcard player that can slot into any zone and fill in for a missing number in a consecutive sequence.', isGullit:true }
        ]
      }
    ]
  },
  ar: {
    title: 'قواعد اللعبة',
    sections: [
      {
        heading: 'شروط الفوز',
        items: [
          { icon:'🏆', badge:'badge-cyan', title:'تكوين تشكيلة صحيحة', desc:'يجب ترتيب اللاعبين في إحدى التشكيلات الثلاث: 4-3-3 أو 4-4-2 أو 5-3-2، مع حارس مرمى واحد دائماً.' },
          { icon:'⭐', badge:'badge-gold', title:'وجود كابتن في التشكيلة', desc:'يجب أن يحتوي الملعب على كارت كابتن واحد على الأقل.' },
          { icon:'✨', badge:'badge-gold', title:'نجمة في كل خط أو أرقام متتالية', desc:'يتحقق الفوز بإحدى طريقتين: إما وجود لاعب نجمة في الدفاع والوسط والهجوم في آن واحد، أو تحقيق أرقام متتالية في أحد الخطوط: 2-3-4 أو 3-4-5 في الدفاع، 6-7-8 في الوسط، أو 9-10-11 في الهجوم. ويمكن لكارت خوليت أن يكمّل الرقم الناقص في التسلسل.' }
        ]
      },
      {
        heading: 'أثناء الدور',
        items: [
          { icon:'🃏', badge:'badge-cyan', title:'سحب حتى بطاقتين', desc:'يمكن سحب بطاقتين من المجموعة كحد أقصى في الدور الواحد.' },
          { icon:'⚽', badge:'badge-cyan', title:'وضع حتى بطاقتين', desc:'يمكن وضع لاعبين أو استخدام بطاقات خاصة، بحد أقصى حركتين في الدور الواحد، ثم إنهاء الدور.' },
          { icon:'📋', badge:'badge-cyan', title:'الالتزام بحدود كل مركز', desc:'الحد الأقصى لكل مركز: حارس مرمى واحد، خمسة مدافعين، أربعة لاعبي وسط، وثلاثة مهاجمين، بإجمالي أحد عشر لاعباً.' }
        ]
      },
      {
        heading: 'البطاقات الخاصة',
        items: [
          { icon:'🔴', badge:'badge-red', title:'البطاقة الحمراء', desc:'تطرد فوراً لاعباً مختاراً من ملعب الخصم.' },
          { icon:'🟡', badge:'badge-gold', title:'البطاقة الصفراء', desc:'تنذر لاعباً. عند حصوله على إنذار ثانٍ يُطرد من الملعب.' },
          { icon:'🚫', badge:'badge-cyan', title:'التسلل', desc:'تُلغي دور اللاعب المستهدف القادم.' },
          { icon:'🔄', badge:'badge-cyan', title:'التبديل', desc:'تُبدّل أحد لاعبيك بلاعب من ملعب الخصم.' },
          { icon:'📝', badge:'badge-gold', title:'العقد', desc:'تنقل لاعباً من ملعب الخصم إلى ملعبك بشكل نهائي.' },
          { icon:'⏳', badge:'badge-cyan', title:'الإعارة', desc:'تستعير لاعباً من الخصم لمدة دورين، ثم يعود إليه تلقائياً.' },
          { icon:'🛡️', badge:'badge-cyan', title:'إلغاء الأمر', desc:'تُلغي بطاقة خاصة استُخدمت ضدك، ويجب استخدامها خلال فترة الرد المحددة.' },
          { icon:'🗑️', badge:'badge-red', title:'استبعاد لاعب', desc:'تُزيل أحد لاعبيك من ملعبك، وتُستخدم لتصحيح خطأ في الوضع.' },
          { icon:'👑', badge:'badge-gold', title:'خوليت', desc:'لاعب مشترك يمكنه شغل أي مركز، ويكمّل الرقم الناقص في تسلسل الأرقام المتتالية.', isGullit:true }
        ]
      }
    ]
  }
};

function renderRules(lang){
  const data = content[lang];
  document.getElementById('modalTitle').textContent = data.title;
  const body = document.getElementById('modalBody');
  body.innerHTML = '';
  data.sections.forEach(sec=>{
    const secEl = document.createElement('div');
    secEl.className = 'rule-section';
    const h = document.createElement('div');
    h.className = 'rule-section-title';
    h.textContent = sec.heading;
    secEl.appendChild(h);
    sec.items.forEach(it=>{
      const row = document.createElement('div');
      row.className = 'rule-item';
      const gullitTag = it.isGullit ? `<span class="gullit-tag"><img src="images/gullit.png" alt="Gullit"><span>Gullit</span></span>` : '';
      row.innerHTML = `
        <div class="rule-badge ${it.badge}">${it.icon}</div>
        <div class="rule-text">
          <div class="rule-text-title">${it.title}${gullitTag}</div>
          <div class="rule-text-desc">${it.desc}</div>
        </div>`;
      secEl.appendChild(row);
    });
    body.appendChild(secEl);
  });
}

function setLang(lang){
  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  document.getElementById('btnAr').classList.toggle('active', lang==='ar');
  document.getElementById('modalBody').setAttribute('dir', lang==='ar' ? 'rtl':'ltr');
  renderRules(lang);
}

renderRules('en');
</script>

</body>
</html>
