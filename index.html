<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>التمثيل</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body {
    min-height: 100%;
    background: #09090B;
    font-family: 'Cairo', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  body { color: #fff; }

  .screen { min-height: 100dvh; width: 100%; }
  .home-bg {
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(236,72,153,0.16), transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 100%, rgba(139,92,246,0.16), transparent 60%),
      #09090B;
  }
  .hero-icon { filter: drop-shadow(0 0 10px #EC4899) drop-shadow(0 0 22px #8B5CF6); }
  .title-gradient {
    background: linear-gradient(90deg, #FB7185 0%, #EC4899 35%, #C084FC 70%, #8B5CF6 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 14px rgba(236,72,153,0.45)) drop-shadow(0 0 28px rgba(139,92,246,0.35));
    letter-spacing: 0.02em;
  }
  .glow-text { color: #C4B5FD; text-shadow: 0 0 8px #8B5CF6, 0 0 24px #8B5CF6, 0 0 48px #6D28D9; }
  .home-card {
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  .btn-hero {
    background: linear-gradient(90deg, #F43F5E, #EC4899 55%, #8B5CF6);
    box-shadow: 0 0 22px rgba(236,72,153,0.45), 0 0 40px rgba(139,92,246,0.25);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn-hero:active { transform: scale(0.97); }
  .btn-hero:disabled { opacity: 0.45; box-shadow: none; }
  .btn-ghost {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    transition: transform .12s ease, background .12s ease;
  }
  .btn-ghost:active { transform: scale(0.96); }
  .btn-correct { background: linear-gradient(135deg, #22C55E, #15803D); box-shadow: 0 0 20px rgba(34,197,94,0.45); }
  .btn-correct:active { transform: scale(0.96); }
  .btn-skip {
    background: linear-gradient(135deg, #F59E0B, #B45309);
    box-shadow: 0 0 20px rgba(245,158,11,0.45);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn-skip:active { transform: scale(0.96); box-shadow: 0 0 12px rgba(245,158,11,0.6); }
  .btn-confirm {
    background: linear-gradient(135deg, #8B5CF6, #6D28D9);
    box-shadow: 0 0 22px rgba(139,92,246,0.55), 0 0 40px rgba(139,92,246,0.25);
    transition: transform .12s ease, box-shadow .12s ease;
    animation: confirmPulse 1.8s ease-in-out infinite;
  }
  .btn-confirm:active { transform: scale(0.96); }
  @keyframes confirmPulse {
    0%, 100% { box-shadow: 0 0 22px rgba(139,92,246,0.55), 0 0 40px rgba(139,92,246,0.25); }
    50%      { box-shadow: 0 0 32px rgba(139,92,246,0.85), 0 0 60px rgba(139,92,246,0.45); }
  }
  .input-glass {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .input-glass:focus-within {
    outline: none; border-color: rgba(196,132,252,0.6);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.15), 0 0 16px rgba(139,92,246,0.25);
  }
  .input-glass::placeholder { color: #52525B; }

  .cat-card {
    background: rgba(255,255,255,0.035);
    border: 1.5px solid rgba(255,255,255,0.10);
    transition: all .15s ease;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 16px 8px;
    text-align: center;
    cursor: pointer;
    min-height: 92px;
  }
  .cat-card.selected {
    border-color: #C084FC;
    box-shadow: 0 0 0 2px rgba(139,92,246,0.25), 0 0 18px rgba(139,92,246,0.4);
    background: rgba(139,92,246,0.10);
  }
  .cat-card:active { transform: scale(0.97); }
  .cat-icon { font-size: 30px; line-height: 1; }
  .cat-name { font-size: 13px; font-weight: 800; line-height: 1.2; }
  .cat-check {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 20px; height: 20px; border-radius: 7px;
    border: 1.5px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900;
    transition: all .15s ease;
    color: #fff;
  }
  .cat-card.selected .cat-check {
    background: linear-gradient(135deg, #EC4899, #8B5CF6);
    border-color: transparent;
    box-shadow: 0 0 10px rgba(236,72,153,0.5);
  }

  .opt-pill {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    transition: all .15s ease;
    color: #E4E4E7;
  }
  .opt-pill.selected {
    border-color: #EC4899;
    background: linear-gradient(90deg, rgba(244,63,94,0.25), rgba(139,92,246,0.25));
    box-shadow: 0 0 12px rgba(236,72,153,0.35);
    color: #fff;
  }

  .name-wrap {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 12px;
    padding: 0 14px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .name-wrap:focus-within {
    border-color: rgba(196,132,252,0.6);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.15), 0 0 16px rgba(139,92,246,0.25);
  }
  .team-name-input {
    width: 100%;
    background: transparent;
    outline: none;
    font-size: 15px;
    padding: 12px 0;
    color: #fff;
    font-family: 'Cairo', sans-serif;
    text-align: center;
    font-weight: 700;
  }
  .team-name-input::placeholder { color: #52525B; font-weight: 400; }

  .timer-ring { transition: stroke-dashoffset 1s linear, stroke .3s ease; }
  .word-reveal { animation: popin .25s ease; }
  @keyframes popin { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #teamStrip::-webkit-scrollbar { display: none; }
  #teamStrip { scrollbar-width: none; }

  .toast { animation: fadein .2s ease, fadeout .3s ease 2.4s forwards; }
  @keyframes fadein { from { opacity:0; transform: translate(50%, 10px);} to { opacity:1; transform: translate(50%,0);} }
  @keyframes fadeout { to { opacity: 0; } }
  .word-swap { animation: swap .28s ease; }
  @keyframes swap {
    0%   { transform: translateX(0) scale(1); opacity: 1; }
    35%  { transform: translateX(-14px) scale(0.94); opacity: 0.4; }
    65%  { transform: translateX(14px) scale(0.94); opacity: 0.4; }
    100% { transform: translateX(0) scale(1); opacity: 1; }
  }
  .timer-flash { animation: flash .45s ease; }
  @keyframes flash {
    0%   { filter: drop-shadow(0 0 0 rgba(245,158,11,0)); }
    40%  { filter: drop-shadow(0 0 12px rgba(245,158,11,0.9)); }
    100% { filter: drop-shadow(0 0 0 rgba(245,158,11,0)); }
  }

  /* حالة العدّاد المتجمّد قبل التأكيد */
  .timer-paused #timerRing { stroke: #C084FC !important; }
  .timer-paused #timerNum { color: #C084FC; text-shadow: 0 0 12px rgba(192,132,252,0.6); }
</style>
</head>
<body class="text-white">

<div id="toastHost" class="fixed top-3 left-1/2 z-50 pointer-events-none"></div>

<!-- ============ SCREEN: SETUP ============ -->
<div id="screen-setup" class="screen home-bg flex flex-col">

  <div class="flex items-center justify-between px-4 pt-4 pb-2 shrink-0">
    <div class="w-10"></div>
    <div class="text-xl font-black glow-text tracking-widest">🎭 التمثيل</div>
    <button id="howToPlayBtn" class="btn-ghost rounded-full w-10 h-10 flex items-center justify-center text-lg">❓</button>
  </div>

  <div class="flex-1 px-4 pb-4 flex flex-col gap-5 max-w-md w-full mx-auto">

    <div>
      <div class="flex items-center justify-between mb-3">
        <div class="text-sm font-bold text-zinc-300">اختر فئة أو أكثر</div>
        <div id="categoryHint" class="text-xs font-bold text-purple-300"></div>
      </div>
      <div id="categoryGrid" class="grid grid-cols-3 gap-3"></div>
    </div>

    <div>
      <div class="text-sm font-bold text-zinc-300 mb-3">مدة الوقت</div>
      <div class="grid grid-cols-3 gap-3">
        <button data-timer="30" class="timer-btn opt-pill rounded-xl py-3.5 text-base font-black">30 ثانية</button>
        <button data-timer="60" class="timer-btn opt-pill rounded-xl py-3.5 text-base font-black selected">60 ثانية</button>
        <button data-timer="90" class="timer-btn opt-pill rounded-xl py-3.5 text-base font-black">90 ثانية</button>
      </div>
    </div>

    <div>
      <div class="text-sm font-bold text-zinc-300 mb-3">عدد الفرق</div>
      <div class="input-glass flex items-center justify-between rounded-2xl px-4 py-3">
        <button id="teamMinus" class="btn-ghost rounded-xl w-11 h-11 text-2xl font-black flex items-center justify-center">−</button>
        <div id="teamCountDisplay" class="text-3xl font-black">2</div>
        <button id="teamPlus" class="btn-ghost rounded-xl w-11 h-11 text-2xl font-black flex items-center justify-center">+</button>
      </div>
    </div>

    <div>
      <div class="text-sm font-bold text-zinc-300 mb-3">أسماء الفرق (اختياري)</div>
      <div id="teamNamesList" class="grid grid-cols-2 gap-3"></div>
    </div>

    <div class="flex-1 min-h-2"></div>

    <button id="startGameBtn" class="btn-hero w-full rounded-2xl py-4 text-lg font-black shrink-0" disabled>
      جاري تحميل البيانات... ⏳
    </button>

  </div>

</div>

<!-- ============ HOW TO PLAY MODAL ============ -->
<div id="howToModal" class="hidden fixed inset-0 z-40 bg-black/85 backdrop-blur-sm flex items-center justify-center px-6">
  <div class="home-card rounded-2xl p-6 w-full max-w-sm text-center max-h-[85vh] overflow-y-auto">
    <div class="text-4xl mb-3">📖</div>
    <h2 class="text-xl font-black title-gradient mb-4">قواعد اللعبة</h2>
    <div id="howToBody" class="text-sm text-zinc-300 leading-relaxed text-right space-y-2"></div>
    <button id="closeHowToBtn" class="btn-hero w-full rounded-xl py-3 font-black mt-5">تمام، فهمت</button>
  </div>
</div>

<!-- ============ SCREEN: GAME ============ -->
<div id="screen-game" class="screen hidden flex-col home-bg">

  <div class="flex items-center justify-between px-4 py-2 shrink-0">
    <button id="endGameBtn" class="btn-ghost rounded-full px-3 py-1.5 text-[11px] font-bold">🏁 إنهاء</button>
    <div class="text-sm font-black glow-text tracking-widest">🎭 التمثيل</div>
    <div class="text-[11px] text-zinc-500 flex items-center gap-2">
      <span id="catNameTag"></span>
      <span class="opt-pill rounded-full px-2 py-0.5">🎯 <span id="targetScoreTag">5</span></span>
    </div>
  </div>

  <div id="teamStrip" class="flex gap-1.5 overflow-x-auto px-3 pb-2 shrink-0"></div>

  <div class="flex-1 flex flex-col items-center justify-center px-6 min-h-0 relative">

    <!-- Turn intro -->
    <div id="turnIntro" class="text-center">
      <div class="text-zinc-400 text-sm mb-1">دور فريق</div>
      <div id="currentTeamName" class="text-3xl font-black title-gradient mb-6"></div>
      <button id="revealBtn" class="btn-hero rounded-2xl px-8 py-5 text-lg font-black">👆 اضغط لإظهار الكلمة</button>
    </div>

    <!-- Active round -->
    <div id="roundActive" class="hidden flex-col items-center w-full">

      <!-- بطاقة الكلمة -->
      <div id="wordCard" class="word-reveal home-card rounded-2xl px-6 py-8 w-full max-w-xs text-center mb-5">
        <div id="wordTag" class="text-[10px] tracking-widest text-purple-300 mb-1"></div>
        <div id="wordText" class="text-2xl font-black leading-snug"></div>
      </div>

      <!-- العدّاد (متجمّد قبل التأكيد) -->
      <div id="timerWrap" class="flex items-center justify-center w-full max-w-xs mb-4">
        <div class="relative w-28 h-28 shrink-0 timer-paused" id="timerCircle">
          <svg viewBox="0 0 100 100" class="w-28 h-28 -rotate-90">
            <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
            <circle id="timerRing" cx="50" cy="50" r="44" fill="none" stroke="#C084FC" stroke-width="8"
              stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0" class="timer-ring"/>
          </svg>
          <div id="timerNum" class="absolute inset-0 flex items-center justify-center text-3xl font-black">60</div>
        </div>
      </div>

      <!-- نص إرشادي -->
      <div id="hintText" class="text-xs text-purple-300 mb-4 text-center font-bold">
        اقرأ الاسم في هدوء، ثم اضغط تأكيد لبدء العدّاد
      </div>

      <!-- زر التأكيد -->
      <button id="confirmBtn" class="btn-confirm rounded-2xl w-full max-w-xs py-4 font-black text-white text-lg mb-4">
        ✅ تأكيد — ابدأ العدّاد
      </button>

      <!-- أزرار التحكم (تظهر بعد التأكيد) -->
      <div id="actionBtns" class="hidden w-full max-w-xs flex flex-col gap-3">
        <button id="correctBtn" class="btn-correct rounded-2xl py-4 w-full font-black text-white text-lg">✅ صح +1</button>
        <button id="skipBtn" class="btn-skip rounded-2xl py-3.5 w-full font-black text-white text-base">
          ⏭️ تخطي (إعادة الوقت)
        </button>
      </div>

    </div>

    <!-- Round end -->
    <div id="roundEnd" class="hidden flex-col items-center text-center">
      <div id="endIcon" class="text-5xl mb-3">⏰</div>
      <div id="endHeadline" class="text-xl font-black mb-1">خلص الوقت!</div>
      <div class="text-zinc-400 text-sm mb-1">فريق <span id="endTeamName" class="text-purple-300 font-bold"></span></div>
      <div class="text-4xl font-black glow-text mb-6"><span id="endRoundScore">+0</span></div>
      <button id="nextTeamBtn" class="btn-hero rounded-xl px-8 py-3.5 font-black">التالي ⏩</button>
    </div>
  </div>
</div>

<!-- ============ FINAL SCOREBOARD MODAL ============ -->
<div id="finalModal" class="hidden fixed inset-0 z-40 bg-black/85 backdrop-blur-sm flex items-center justify-center px-6">
  <div class="home-card rounded-2xl p-6 w-full max-w-sm text-center">
    <div class="text-5xl mb-3">🏆</div>
    <h2 class="text-2xl font-black title-gradient mb-4">النتيجة النهائية</h2>
    <div id="finalScoreList" class="space-y-2 mb-6 text-right"></div>
    <button id="playAgainBtn" class="btn-hero w-full rounded-xl py-3 font-black">لعبة جديدة 🔄</button>
  </div>
</div>

<script>
// ============ إعداد الفئات ============
const PACKS = {
  movies: { icon: '🎬', name: 'أفلام ومسلسلات', filename: 'movies.json' },
  players: { icon: '⚽', name: 'لاعيبة كرة قدم', filename: 'players.json' },
  anime: { icon: '🀄', name: 'أنمي', filename: 'anime.json' }
};
const PACK_ORDER = ['movies', 'players', 'anime'];

const state = {
  selectedPacks: ['movies'],
  timerDuration: 60,
  teamCount: 2,
  teams: [],
  currentTeamIndex: 0,
  wordQueue: [],
  usedWords: new Set(),
  lastWord: null,
  timeLeft: 60,
  timerId: null,
  roundActive: false,
  timerRunning: false,     // هل العدّاد يعمل الآن؟
  targetScore: 5,
  deuceTriggered: false,
  gameOver: false,
  winner: null,
};

let dataLoaded = false;
const $ = (id) => document.getElementById(id);
const RING_CIRC = 276.5;

// ============ أدوات مساعدة ============
function toast(text) {
  const host = $('toastHost');
  const el = document.createElement('div');
  el.className = 'toast home-card rounded-full px-4 py-2 text-sm mb-2';
  el.style.left = '50%';
  el.textContent = text;
  host.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ============ الأصوات ============
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, duration, type = 'sine', gainVal = 0.18) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = gainVal;
  osc.connect(gain).connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(gainVal, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  osc.start(now);
  osc.stop(now + duration);
}
function tickSound() { beep(880, 0.08, 'square', 0.12); }
function buzzSound() { beep(160, 0.5, 'sawtooth', 0.22); setTimeout(() => beep(120, 0.6, 'sawtooth', 0.22), 150); }
function correctSound() { beep(1046, 0.12, 'sine', 0.16); setTimeout(() => beep(1318, 0.14, 'sine', 0.16), 90); }
function skipSound() {
  beep(520, 0.08, 'triangle', 0.14);
  setTimeout(() => beep(660, 0.09, 'triangle', 0.14), 70);
  setTimeout(() => beep(820, 0.10, 'triangle', 0.14), 150);
}
function confirmSound() {
  beep(660, 0.10, 'sine', 0.18);
  setTimeout(() => beep(880, 0.12, 'sine', 0.18), 90);
  setTimeout(() => beep(1170, 0.16, 'sine', 0.18), 200);
}

// ============ تبديل الشاشات ============
function showScreen(id) {
  ['screen-setup', 'screen-game'].forEach((s) => {
    $(s).classList.toggle('hidden', s !== id);
    $(s).classList.toggle('flex', s === id);
  });
  window.scrollTo(0, 0);
}

// ============ بناء شاشة الإعداد ============
function updateCategoryHint() {
  const n = state.selectedPacks.length;
  $('categoryHint').textContent = n > 0 ? `${n} مختارة` : 'اختر فئة واحدة على الأقل';
}

function renderCategories() {
  const grid = $('categoryGrid');
  grid.innerHTML = '';
  if (state.selectedPacks.length === 0) state.selectedPacks = [PACK_ORDER[0]];

  PACK_ORDER.forEach((key) => {
    const pack = PACKS[key];
    const isSelected = state.selectedPacks.includes(key);

    const card = document.createElement('button');
    card.type = 'button';
    card.className = `cat-card rounded-2xl w-full ${isSelected ? 'selected' : ''}`;
    card.innerHTML = `
      <div class="cat-icon">${pack.icon}</div>
      <div class="cat-name">${pack.name}</div>
      <div class="cat-check">${isSelected ? '✓' : ''}</div>
    `;

    card.addEventListener('click', () => {
      const idx = state.selectedPacks.indexOf(key);
      if (idx >= 0) {
        if (state.selectedPacks.length === 1) {
          toast('لازم فئة واحدة على الأقل');
          return;
        }
        state.selectedPacks.splice(idx, 1);
        card.classList.remove('selected');
        card.querySelector('.cat-check').textContent = '';
      } else {
        state.selectedPacks.push(key);
        card.classList.add('selected');
        card.querySelector('.cat-check').textContent = '✓';
      }
      updateCategoryHint();
    });

    grid.appendChild(card);
  });

  updateCategoryHint();
}

function renderTeamNameInputs() {
  const list = $('teamNamesList');
  list.innerHTML = '';
  for (let i = 0; i < state.teamCount; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'name-wrap';
    wrap.innerHTML = `
      <input type="text" maxlength="14" data-idx="${i}"
        placeholder="فريق ${i + 1}"
        class="team-name-input" />
    `;
    list.appendChild(wrap);
  }
}

function buildSetupScreen() {
  renderCategories();
  renderTeamNameInputs();

  const startBtn = $('startGameBtn');
  if (dataLoaded) {
    startBtn.disabled = false;
    startBtn.textContent = 'ابدأ اللعب 🎬';
  } else {
    startBtn.disabled = true;
    startBtn.textContent = 'جاري تحميل البيانات... ⏳';
  }
}

// ============ أزرار الإعداد ============
$('howToPlayBtn').addEventListener('click', () => {
  const lines = [
    '🎯 كل فريق يأخذ دوره في تمثيل كلمة والباقي يخمّنون.',
    '🗂️ اختر فئة أو أكثر؛ لو اخترت أكثر من فئة، الكلمات تُسحب بشكل عشوائي.',
    '👆 اضغط "إظهار الكلمة"، ثم اقرأ الاسم في هدوء.',
    '🟣 بعد القراءة، اضغط "تأكيد" ليبدأ العدّاد التنازلي.',
    '✅ لو الفريق خمّن صح اضغط "صح +1" وينتهي الدور فورًا.',
    '⏭️ لو الكلمة صعبة، اضغط "تخطي" — تظهر كلمة جديدة ويُعاد ضبط العدّاد من جديد (ويمكنك قراءتها بهدوء قبل التأكيد).',
    '⏰ لو الوقت خلص من غير تخمين، الفريق يأخذ صفر وينتقل الدور.',
    '🏆 أول فريق يصل لـ 5 نقاط يفوز.',
    '🔥 لو الفريقان تعادلا 4-4، الهدف يزيد لـ 6 نقاط.'
  ];
  $('howToBody').innerHTML = lines.map((l) => `<div>${l}</div>`).join('');
  $('howToModal').classList.remove('hidden');
  $('howToModal').classList.add('flex');
});

$('closeHowToBtn').addEventListener('click', () => {
  $('howToModal').classList.add('hidden');
  $('howToModal').classList.remove('flex');
});

document.querySelectorAll('.timer-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.timer-btn').forEach((b) => b.classList.remove('selected'));
    btn.classList.add('selected');
    state.timerDuration = parseInt(btn.dataset.timer, 10);
  });
});

$('teamMinus').addEventListener('click', () => {
  state.teamCount = Math.max(2, state.teamCount - 1);
  $('teamCountDisplay').textContent = state.teamCount;
  renderTeamNameInputs();
});

$('teamPlus').addEventListener('click', () => {
  state.teamCount = Math.min(8, state.teamCount + 1);
  $('teamCountDisplay').textContent = state.teamCount;
  renderTeamNameInputs();
});

// ============ تحميل البيانات ============
async function loadAllData() {
  const filesToFetch = ['movies.json', 'players.json', 'anime.json'];
  const cache = {};
  await Promise.all(filesToFetch.map(async (filename) => {
    try {
      const res = await fetch(filename);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      cache[filename] = await res.json();
    } catch (err) {
      console.error(`خطأ في تحميل ${filename}:`, err);
      cache[filename] = [];
    }
  }));
  window._rawFiles = cache;
  dataLoaded = true;
  buildSetupScreen();
}

// ============ بدء اللعبة ============
$('startGameBtn').addEventListener('click', () => {
  ensureAudio();
  if (!dataLoaded) { toast('برجاء الانتظار حتى يتم تحميل البيانات'); return; }
  if (state.selectedPacks.length === 0) { toast('اختر فئة واحدة على الأقل'); return; }

  const nameInputs = document.querySelectorAll('.team-name-input');
  state.teams = [];
  nameInputs.forEach((inp, i) => {
    const val = inp.value.trim();
    state.teams.push({ name: val || `فريق ${i + 1}`, score: 0 });
  });

  state.wordQueue = buildMergedWordPool();
  state.usedWords = new Set();
  state.lastWord = null;
  state.currentTeamIndex = 0;
  state.targetScore = 5;
  state.deuceTriggered = false;
  state.gameOver = false;
  state.winner = null;
  state.timerRunning = false;

  $('catNameTag').textContent = state.selectedPacks.map((k) => PACKS[k].icon).join(' ');
  $('targetScoreTag').textContent = state.targetScore;

  renderTeamStrip();
  showScreen('screen-game');
  startTurn();
});

// ============ بناء قائمة الكلمات ============
function buildMergedWordPool() {
  const pool = [];
  const cache = window._rawFiles || {};
  state.selectedPacks.forEach((key) => {
    const rawData = cache[PACKS[key].filename] || [];
    if (!Array.isArray(rawData)) return;
    rawData.forEach((item) => {
      if (!item || typeof item !== 'object') return;
      const text = item.name;
      if (typeof text === 'string' && text.trim().length > 0) {
        pool.push({ word: text.trim(), packKey: key, icon: PACKS[key].icon });
      }
    });
  });
  const seen = new Set();
  const unique = [];
  pool.forEach((entry) => {
    if (!seen.has(entry.word)) { seen.add(entry.word); unique.push(entry); }
  });
  return shuffle(unique);
}

// ============ اختيار كلمة جديدة ============
function pickNextWord() {
  if (state.wordQueue.length === 0) {
    state.wordQueue = buildMergedWordPool();
    if (state.wordQueue.length === 0) return null;
  }
  let picked = state.wordQueue.pop();
  let attempts = 0;
  while (state.lastWord && picked.word === state.lastWord.word && attempts < 5 && state.wordQueue.length > 0) {
    state.wordQueue.unshift(picked);
    picked = state.wordQueue.pop();
    attempts++;
  }
  state.lastWord = picked;
  state.usedWords.add(picked.word);
  return picked;
}

// ============ عرض الكلمة الحالية ============
function displayWord(entry, animate = false) {
  const card = $('wordCard');
  if (!entry) {
    $('wordText').textContent = 'لا توجد كلمات';
    $('wordTag').textContent = '';
    return;
  }
  if (animate) {
    card.classList.remove('word-swap');
    void card.offsetWidth;
    card.classList.add('word-swap');
  }
  $('wordText').textContent = entry.word;
  const pack = PACKS[entry.packKey];
  $('wordTag').textContent = `${pack.icon} ${pack.name}`;
}

// ============ إدارة العدّاد ============
function updateTimerUI() {
  $('timerNum').textContent = state.timeLeft;
  const fraction = Math.max(0, state.timeLeft) / state.timerDuration;
  const offset = RING_CIRC * (1 - fraction);
  const ring = $('timerRing');
  ring.style.strokeDashoffset = offset;
  ring.setAttribute('stroke', state.timeLeft <= 10 ? '#EF4444' : '#8B5CF6');
}

function freezeTimer() {
  // تجميد العدّاد عند المدة الكاملة بدون تشغيل
  clearInterval(state.timerId);
  state.timerRunning = false;
  state.timeLeft = state.timerDuration;
  updateTimerUI();
  $('timerCircle').classList.add('timer-paused');
  $('confirmBtn').classList.remove('hidden');
  $('actionBtns').classList.add('hidden');
  $('hintText').classList.remove('hidden');
}

function startTimer() {
  clearInterval(state.timerId);
  state.timerRunning = true;
  updateTimerUI();
  $('timerCircle').classList.remove('timer-paused');
  $('confirmBtn').classList.add('hidden');
  $('actionBtns').classList.remove('hidden');
  $('hintText').classList.add('hidden');

  state.timerId = setInterval(() => {
    state.timeLeft--;
    updateTimerUI();
    if (state.timeLeft <= 5 && state.timeLeft > 0) tickSound();
    if (state.timeLeft <= 0) {
      clearInterval(state.timerId);
      state.timerRunning = false;
      buzzSound();
      endRound('timeout');
    }
  }, 1000);
}

// ============ شاشة اللعب ============
function renderTeamStrip() {
  const strip = $('teamStrip');
  strip.innerHTML = '';
  state.teams.forEach((team, i) => {
    const isCurrent = i === state.currentTeamIndex;
    const item = document.createElement('div');
    item.className = `opt-pill rounded-xl px-3 py-1.5 shrink-0 flex items-center gap-2 ${isCurrent ? 'selected font-bold' : 'opacity-70'}`;
    item.innerHTML = `
      <span class="text-xs">${team.name}</span>
      <span class="text-xs font-black text-purple-300 bg-white/10 px-1.5 py-0.5 rounded-md">${team.score}</span>
    `;
    strip.appendChild(item);
  });
}

function startTurn() {
  clearInterval(state.timerId);
  state.roundActive = false;
  state.timerRunning = false;
  renderTeamStrip();

  $('turnIntro').classList.remove('hidden');
  $('roundActive').classList.add('hidden');
  $('roundActive').classList.remove('flex');
  $('roundEnd').classList.add('hidden');
  $('roundEnd').classList.remove('flex');

  $('currentTeamName').textContent = state.teams[state.currentTeamIndex].name;
}

// ============ زر إظهار الكلمة (لا يشغل العدّاد) ============
$('revealBtn').addEventListener('click', () => {
  ensureAudio();
  $('turnIntro').classList.add('hidden');
  $('roundActive').classList.remove('hidden');
  $('roundActive').classList.add('flex');

  const entry = pickNextWord();
  displayWord(entry, false);

  state.roundActive = true;
  // لا نبدأ العدّاد — نعرضه مجمّداً مع زر التأكيد
  freezeTimer();
});

// ============ زر التأكيد (يبدأ العدّاد) ============
$('confirmBtn').addEventListener('click', () => {
  if (!state.roundActive) return;
  if (state.timerRunning) return;
  ensureAudio();
  confirmSound();
  startTimer();
});

// ============ زر التخطي (يعيد الكلمة + يجمّد العدّاد + يطلب تأكيد جديد) ============
$('skipBtn').addEventListener('click', () => {
  if (!state.roundActive) return;
  skipSound();
  const entry = pickNextWord();
  displayWord(entry, true);
  // العودة لمرحلة القراءة الهادئة: تجميد العدّاد + إظهار زر التأكيد
  freezeTimer();
});

// ============ زر الإجابة الصحيحة ============
$('correctBtn').addEventListener('click', () => {
  if (!state.roundActive) return;
  clearInterval(state.timerId);
  state.timerRunning = false;
  correctSound();
  state.teams[state.currentTeamIndex].score += 1;
  endRound('correct');
});

function checkDeuceAndWinner() {
  if (!state.deuceTriggered) {
    const allAtDeuce = state.teams.length >= 2 &&
      state.teams.every((team) => team.score === state.targetScore - 1);
    if (allAtDeuce) {
      state.targetScore += 1;
      state.deuceTriggered = true;
      $('targetScoreTag').textContent = state.targetScore;
      toast('🔥 تعادل! الهدف أصبح 6 نقاط');
    }
  }
  const winner = state.teams.find((team) => team.score >= state.targetScore);
  if (winner) { state.gameOver = true; state.winner = winner; }
}

function endRound(outcome) {
  state.roundActive = false;
  state.timerRunning = false;
  checkDeuceAndWinner();

  $('roundActive').classList.add('hidden');
  $('roundActive').classList.remove('flex');
  $('roundEnd').classList.remove('hidden');
  $('roundEnd').classList.add('flex');

  const cur = state.teams[state.currentTeamIndex];
  $('endTeamName').textContent = cur.name;

  if (outcome === 'correct') {
    $('endIcon').textContent = '🎉';
    $('endHeadline').textContent = 'إجابة صحيحة!';
    $('endRoundScore').textContent = '+1';
    $('endRoundScore').className = 'text-4xl font-black text-green-400 mb-6';
  } else {
    $('endIcon').textContent = '⏰';
    $('endHeadline').textContent = 'خلص الوقت!';
    $('endRoundScore').textContent = '+0';
    $('endRoundScore').className = 'text-4xl font-black text-zinc-500 mb-6';
  }

  $('nextTeamBtn').textContent = state.gameOver ? 'عرض النتيجة 🏆' : 'التالي ⏩';
}

$('nextTeamBtn').addEventListener('click', () => {
  if (state.gameOver) { showFinalBoard(); return; }
  state.currentTeamIndex = (state.currentTeamIndex + 1) % state.teams.length;
  startTurn();
});

$('endGameBtn').addEventListener('click', () => {
  clearInterval(state.timerId);
  showFinalBoard();
});

function showFinalBoard() {
  const sorted = [...state.teams].sort((a, b) => b.score - a.score);
  const list = $('finalScoreList');
  list.innerHTML = '';
  sorted.forEach((team, i) => {
    const isWinner = i === 0 && team.score > 0;
    const item = document.createElement('div');
    item.className = `input-glass rounded-xl px-4 py-3 flex items-center justify-between ${isWinner ? 'border-purple-400 bg-purple-500/10' : ''}`;
    item.innerHTML = `
      <div class="flex items-center gap-3">
        <span class="text-xl">${i === 0 ? '👑' : i === 1 ? '🥈' : i === 2 ? '🥉' : '👏'}</span>
        <span class="font-bold text-base">${team.name}</span>
      </div>
      <span class="text-xl font-black text-purple-300">${team.score}</span>
    `;
    list.appendChild(item);
  });
  $('finalModal').classList.remove('hidden');
  $('finalModal').classList.add('flex');
}

$('playAgainBtn').addEventListener('click', () => {
  $('finalModal').classList.add('hidden');
  $('finalModal').classList.remove('flex');
  showScreen('screen-setup');
});

// ============ التشغيل ============
buildSetupScreen();
loadAllData();
</script>
</body>
</html>
